services:
  - type: web
    name: crowd-signal-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: GNEWS_API_KEY
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
